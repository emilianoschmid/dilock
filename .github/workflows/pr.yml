  required:
    name: Required CI gate
    if: always()
    needs: [source, native, postgres-advisory, postgres-advisory-typescript, postgres-advisory-cross-language, postgres-advisory-dotnet, postgres-advisory-cpp, postgres-advisory-cabi-facades, postgres-advisory-haskell, postgres-advisory-java, postgres-advisory-scala, postgres-advisory-kotlin, postgres-advisory-groovy, postgres-advisory-go, postgres-advisory-rust, postgres-advisory-elixir, postgres-advisory-dart, postgres-advisory-swift, postgres-advisory-julia, postgres-advisory-php, postgres-advisory-ruby, postgres-advisory-perl, postgres-advisory-r, postgres-advisory-clojure]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every source and SDK job to succeed
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          POSTGRES_RESULT: ${{ needs.postgres-advisory.result }}
          POSTGRES_TYPESCRIPT_RESULT: ${{ needs.postgres-advisory-typescript.result }}
          POSTGRES_CROSS_LANGUAGE_RESULT: ${{ needs.postgres-advisory-cross-language.result }}
          POSTGRES_DOTNET_RESULT: ${{ needs.postgres-advisory-dotnet.result }}
          POSTGRES_CPP_RESULT: ${{ needs.postgres-advisory-cpp.result }}
          POSTGRES_CABI_FACADES_RESULT: ${{ needs.postgres-advisory-cabi-facades.result }}
          POSTGRES_HASKELL_RESULT: ${{ needs.postgres-advisory-haskell.result }}
          POSTGRES_JAVA_RESULT: ${{ needs.postgres-advisory-java.result }}
          POSTGRES_SCALA_RESULT: ${{ needs.postgres-advisory-scala.result }}
          POSTGRES_KOTLIN_RESULT: ${{ needs.postgres-advisory-kotlin.result }}
          POSTGRES_GROOVY_RESULT: ${{ needs.postgres-advisory-groovy.result }}
          POSTGRES_GO_RESULT: ${{ needs.postgres-advisory-go.result }}
          POSTGRES_RUST_RESULT: ${{ needs.postgres-advisory-rust.result }}
          POSTGRES_ELIXIR_RESULT: ${{ needs.postgres-advisory-elixir.result }}
          POSTGRES_DART_RESULT: ${{ needs.postgres-advisory-dart.result }}
          POSTGRES_SWIFT_RESULT: ${{ needs.postgres-advisory-swift.result }}
          POSTGRES_JULIA_RESULT: ${{ needs.postgres-advisory-julia.result }}
          POSTGRES_PHP_RESULT: ${{ needs.postgres-advisory-php.result }}
          POSTGRES_RUBY_RESULT: ${{ needs.postgres-advisory-ruby.result }}
          POSTGRES_PERL_RESULT: ${{ needs.postgres-advisory-perl.result }}
          POSTGRES_R_RESULT: ${{ needs.postgres-advisory-r.result }}
          POSTGRES_CLOJURE_RESULT: ${{ needs.postgres-advisory-clojure.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$POSTGRES_TYPESCRIPT_RESULT" = success
          test "$POSTGRES_CROSS_LANGUAGE_RESULT" = success
          test "$POSTGRES_DOTNET_RESULT" = success
          test "$POSTGRES_CPP_RESULT" = success
          test "$POSTGRES_CABI_FACADES_RESULT" = success
          test "$POSTGRES_HASKELL_RESULT" = success
          test "$POSTGRES_JAVA_RESULT" = success
          test "$POSTGRES_SCALA_RESULT" = success
          test "$POSTGRES_KOTLIN_RESULT" = success
          test "$POSTGRES_GROOVY_RESULT" = success
          test "$POSTGRES_GO_RESULT" = success
          test "$POSTGRES_RUST_RESULT" = success
          test "$POSTGRES_ELIXIR_RESULT" = success
          test "$POSTGRES_DART_RESULT" = success
          test "$POSTGRES_SWIFT_RESULT" = success
          test "$POSTGRES_JULIA_RESULT" = success
          test "$POSTGRES_PHP_RESULT" = success
          test "$POSTGRES_RUBY_RESULT" = success
          test "$POSTGRES_PERL_RESULT" = success
          test "$POSTGRES_R_RESULT" = success
          test "$POSTGRES_CLOJURE_RESULT" = success
