name: PR CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.9'
      - name: Install root test runner
        run: python -m pip install --disable-pip-version-check 'pytest==9.0.2'
      - name: Validate blueprint, vectors, task graph and links
        run: python tools/bootstrap_check.py
      - name: Run shared bootstrap and conformance tests
        run: python -m pytest -q
      - name: Run root bootstrap tests
        run: python -m unittest discover -s tests/bootstrap -v

  native:
    name: Native SDK tests (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk: [dotnet, cpp, python, typescript, go, rust, java]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        if: matrix.sdk == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.416'
      - name: Set up Node.js
        if: matrix.sdk == 'typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
      - name: Set up Python
        if: matrix.sdk == 'python' || matrix.sdk == 'cpp'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.9'
      - name: Set up Go
        if: matrix.sdk == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
          cache: false
      - name: Set up Java
        if: matrix.sdk == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'

      - name: Install Conan and resolve C++ SDK dependencies
        if: matrix.sdk == 'cpp'
        working-directory: sdk/cpp
        run: |
          python -m pip install --disable-pip-version-check 'conan==2.22.2'
          conan profile detect --force
          conan install conanfile.py --output-folder ../../.tools/ci/cpp-deps --build=missing -s build_type=Release

      - name: Install Python SDK and test dependencies
        if: matrix.sdk == 'python'
        working-directory: sdk/python
        run: |
          python -m pip install --disable-pip-version-check '.[redis,etcd]' 'pytest==9.0.2' 'pytest-asyncio==1.3.0'

      - name: Install Rust toolchain
        if: matrix.sdk == 'rust'
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy

      - name: Install pinned protoc for Rust etcd-client
        if: matrix.sdk == 'rust'
        shell: bash
        run: |
          set -euo pipefail
          version=31.1
          archive="protoc-${version}-linux-x86_64.zip"
          download="$RUNNER_TEMP/$archive"
          install_dir="$RUNNER_TEMP/protoc-${version}"
          curl --fail --location --retry 0 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${version}/${archive}" \
            --output "$download"
          echo "96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065  $download" | sha256sum --check --status
          mkdir -p "$install_dir"
          unzip -q "$download" -d "$install_dir"
          test -x "$install_dir/bin/protoc"
          "$install_dir/bin/protoc" --version | grep -Fx "libprotoc $version"
          echo "PROTOC=$install_dir/bin/protoc" >> "$GITHUB_ENV"
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Test .NET SDK
        id: test_dotnet
        if: matrix.sdk == 'dotnet'
        run: dotnet test sdk/dotnet/Tests/Dilock.Tests.csproj --configuration Release
      - name: Build and test C++ SDK
        id: test_cpp
        if: matrix.sdk == 'cpp'
        run: |
          cmake -S sdk/cpp -B .tools/ci/cpp-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.tools/ci/cpp-deps/build/Release/generators/conan_toolchain.cmake" -DDILOCK_BUILD_TESTS=ON -DDILOCK_BUILD_ETCD=OFF
          cmake --build .tools/ci/cpp-build --parallel 2
          ctest --test-dir .tools/ci/cpp-build --output-on-failure
      - name: Test Python SDK
        id: test_python
        if: matrix.sdk == 'python'
        working-directory: sdk/python
        run: python -m pytest -p no:cacheprovider -q tests
      - name: Test TypeScript SDK
        id: test_typescript
        if: matrix.sdk == 'typescript'
        working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Test Go SDK
        id: test_go
        if: matrix.sdk == 'go'
        working-directory: sdk/go
        run: go test -mod=readonly ./...
      - name: Test Rust SDK
        id: test_rust
        if: matrix.sdk == 'rust'
        working-directory: sdk/rust
        run: cargo +1.99.0 test --locked --workspace
      - name: Test Java SDK
        id: test_java
        if: matrix.sdk == 'java'
        run: mvn --batch-mode --no-transfer-progress --file sdk/java/pom.xml test

      - name: Require the selected SDK test to have run and passed
        if: always()
        env:
          SDK: ${{ matrix.sdk }}
          DOTNET_RESULT: ${{ steps.test_dotnet.outcome }}
          CPP_RESULT: ${{ steps.test_cpp.outcome }}
          PYTHON_RESULT: ${{ steps.test_python.outcome }}
          TYPESCRIPT_RESULT: ${{ steps.test_typescript.outcome }}
          GO_RESULT: ${{ steps.test_go.outcome }}
          RUST_RESULT: ${{ steps.test_rust.outcome }}
          JAVA_RESULT: ${{ steps.test_java.outcome }}
        run: |
          case "$SDK" in
            dotnet) result="$DOTNET_RESULT" ;;
            cpp) result="$CPP_RESULT" ;;
            python) result="$PYTHON_RESULT" ;;
            typescript) result="$TYPESCRIPT_RESULT" ;;
            go) result="$GO_RESULT" ;;
            rust) result="$RUST_RESULT" ;;
            java) result="$JAVA_RESULT" ;;
            *) echo "Unexpected SDK matrix cell: $SDK" >&2; exit 1 ;;
          esac
          test "$result" = success

  required:
    name: Required CI gate
    if: always()
    needs: [source, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every source and SDK job to succeed
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$NATIVE_RESULT" = success
