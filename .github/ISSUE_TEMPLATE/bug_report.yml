name: Bug report
description: Report a reproducible SDK, protocol or packaging defect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include secrets. Report vulnerabilities through the private security route. This snapshot is an implementation blueprint."
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: SDK, OS/runtime, backend/server/client versions and topology.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducer
      description: Commands/code, expected result, actual result and sanitized diagnostics.
    validations:
      required: true
  - type: textarea
    id: failures
    attributes:
      label: Failure context
      description: Pause, restart, failover, restore, cancellation, expiry or network conditions.
