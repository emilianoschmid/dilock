worker_processes 1;
error_log stderr notice;
pid /tmp/nginx.pid;
env DILOCK_C_LIBRARY;
events { worker_connections 64; }
thread_pool dilock threads=2 max_queue=16;
http {
    access_log off;
    lua_check_client_abort on;
    lua_worker_thread_vm_pool_size 8;
    lua_package_path "/opt/dilock/lua/lib/?.lua;;";
    resolver 127.0.0.11 ipv6=off;
    exit_worker_by_lua_block {
        local ok, err = require("dilock_etcd").shutdown_all()
        if not ok then ngx.log(ngx.ERR, "Dilock worker shutdown cleanup failed: ", err)
        else ngx.log(ngx.NOTICE, "Dilock worker shutdown cleanup completed") end
    }
    server {
        listen 8080;
        location = /integration {
            content_by_lua_file /opt/dilock/lua/test/etcd_live_handler.lua;
        }
    }
}
