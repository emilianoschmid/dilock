worker_processes 1;
error_log stderr notice;
pid /tmp/nginx-consul.pid;
env DILOCK_CONSUL_ENDPOINT;
env DILOCK_CONSUL_NAMESPACE;
env DILOCK_CONSUL_EPOCH;
env DILOCK_CONSUL_TOKEN;

events { worker_connections 32; }

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    access_log off;
    lua_package_path "/workspace/lib/?.lua;;";
    server {
        listen 8081;
        location = /consul-integration {
            content_by_lua_file /workspace/test/consul_live_handler.lua;
        }
    }
}
