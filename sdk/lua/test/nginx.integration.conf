worker_processes 1;
error_log stderr notice;
pid /tmp/nginx.pid;
env DILOCK_REDIS_HOST;

events {
    worker_connections 32;
}

http {
    access_log off;
    lua_package_path "/workspace/lib/?.lua;;";
    resolver 127.0.0.11 ipv6=off;

    server {
        listen 8080;

        location = /integration {
            content_by_lua_file /workspace/test/live_handler.lua;
        }
    }
}
