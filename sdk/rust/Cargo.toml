[workspace]
members = ["dilock", "etcd", "redis", "consul", "postgres", "worker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
getrandom = "=0.4.3"
etcd-client = "=0.20.0"
redis = { version = "=1.3.0", default-features = false, features = ["tokio-comp"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
thiserror = "=2.0.17"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "io-std", "signal"] }
tokio-postgres = "=0.7.18"
